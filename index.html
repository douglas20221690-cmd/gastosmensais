<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle de Gastos PWA</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="512x512" href="icon.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">
    
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #10b981; }
        [v-cloak] { display: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        #splash-screen {
            position: fixed; inset: 0; background: #10b981;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .expense-item { padding: 0.9rem 1.1rem; border-radius: 1.2rem; }
        .expense-icon { width: 2.6rem; height: 2.6rem; font-size: 0.9rem; }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; border-top: 1px solid #e5e7eb;
            display: flex; justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 40;
        }
        .nav-item {
            flex: 1; padding: 0.8rem 0; display: flex; flex-direction: column;
            align-items: center; font-size: 0.75rem; font-weight: 600;
            color: #9ca3af; transition: color 0.2s;
        }
        .nav-item.active { color: #10b981; }

        .calc-btn {
            background: #f3f4f6;
            padding: 1.2rem 0;
            border-radius: 1rem;
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s;
        }
        .calc-btn:active { background: #e5e7eb; scale: 0.95; }
        .calc-btn-op { background: #10b981; color: white; }
        .calc-btn-op:active { background: #059669; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">

    <div id="splash-screen">
        <div class="bg-white/20 p-6 rounded-full mb-6">
            <img src="icon.png?v=3" alt="Logo" class="w-16 h-16 object-contain">
        </div>
        <p class="text-white font-medium opacity-80 text-sm">Iniciando...</p>
    </div>

    <div id="app" class="flex flex-col h-full relative" v-cloak>

        <!-- LOGIN -->
        <div v-if="!user && appReady" class="absolute inset-0 z-50 bg-emerald-600 flex flex-col items-center justify-center p-6 animate-fade-in">
            <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-2xl">
                <div class="text-center mb-8">
                    <img src="icon.png?v=3" alt="Logo" class="w-16 h-16 mx-auto mb-4 bg-emerald-100 rounded-full p-2">
                    <h1 class="text-xl font-bold text-gray-800">Minhas Finanças</h1>
                </div>
                <form @submit.prevent="handleLogin" class="space-y-4">
                    <input type="email" v-model="loginEmail" class="w-full px-4 py-3 bg-gray-50 rounded-lg border outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="E-mail" required>
                    <input type="password" v-model="loginPassword" class="w-full px-4 py-3 bg-gray-50 rounded-lg border outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="Senha" required>
                    <button type="submit" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold shadow-lg" :disabled="isLoggingIn">Entrar</button>
                </form>
            </div>
        </div>
        
        <!-- APP -->
        <template v-else-if="user && appReady">
            <header class="bg-emerald-600 text-white p-5 shadow-lg rounded-b-3xl z-10 shrink-0">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-lg font-bold flex items-center">
                        <img src="icon.png?v=3" class="w-7 h-7 mr-2 bg-white/20 rounded-full p-1">
                        {{ activeTab === 'list' ? 'Movimentações' : (viewingCategory ? viewingCategory : 'Análise por Categoria') }}
                    </h1>
                    <div class="flex gap-4">
                        <button @click="toggleSettings" class="opacity-80"><i class="fas fa-cog"></i></button>
                        <button @click="handleLogout" class="opacity-80"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>

                <div class="flex items-center justify-between bg-emerald-700/40 rounded-xl p-1 mb-3">
                    <button @click="changeMonth(-1)" class="w-9 h-9 flex items-center justify-center"><i class="fas fa-chevron-left text-xs"></i></button>
                    <span class="font-bold text-sm capitalize">{{ currentMonthDisplay }}</span>
                    <button @click="changeMonth(1)" class="w-9 h-9 flex items-center justify-center"><i class="fas fa-chevron-right text-xs"></i></button>
                </div>

                <!-- LAYOUT DO HEADER RESTAURADO -->
                <div class="animate-fade-in space-y-1">
                    <div class="flex justify-between items-end">
                        <div>
                            <p class="text-emerald-100 text-[10px] uppercase font-bold tracking-wider mb-1">Saldo Livre</p>
                            <div class="text-3xl font-bold leading-none">{{ formatCurrency(remainingBudget) }}</div>
                        </div>
                        <div class="text-right">
                            <p class="text-emerald-100 text-[10px] uppercase font-bold tracking-wider mb-1">Uso do Limite</p>
                            <div class="text-lg font-bold leading-none">{{ progressPercentage.toFixed(0) }}%</div>
                        </div>
                    </div>
                    
                    <div class="mt-3 h-2 bg-emerald-800/30 rounded-full overflow-hidden relative">
                        <div class="h-full transition-all duration-500 absolute left-0 top-0 z-10" :class="progressBarColor" :style="{ width: progressPercentage + '%' }"></div>
                        <div class="h-full w-0.5 bg-white/40 absolute top-0 z-20" :style="{ left: expectedProgress + '%' }" title="Meta para hoje"></div>
                    </div>
                    
                    <div class="flex justify-between text-[10px] text-emerald-100 font-bold uppercase mt-1">
                        <span>Gasto: {{ formatCurrency(totalSpent) }}</span>
                        <span :class="{'text-orange-200 animate-pulse': progressPercentage > expectedProgress}">
                            Meta Hoje: {{ expectedProgress.toFixed(0) }}%
                        </span>
                        <span>Limite: {{ formatCurrency(currentMonthlyLimit) }}</span>
                    </div>
                </div>
            </header>

            <!-- LISTA -->
            <main v-if="activeTab === 'list'" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar pb-32">
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-orange-50 p-3 rounded-2xl border border-orange-100 flex flex-col items-center">
                        <span class="text-[10px] text-orange-400 font-bold uppercase">Total Débito</span>
                        <span class="text-base font-bold text-orange-700">{{ formatCurrency(totalDebit) }}</span>
                    </div>
                    <div class="bg-indigo-50 p-3 rounded-2xl border border-indigo-100 flex flex-col items-center">
                        <span class="text-[10px] text-indigo-400 font-bold uppercase">Total Crédito</span>
                        <span class="text-base font-bold text-indigo-700">{{ formatCurrency(totalCredit) }}</span>
                    </div>
                </div>

                <div v-if="loading" class="text-center text-gray-300 mt-10"><i class="fas fa-circle-notch fa-spin"></i></div>
                <div v-else-if="filteredTransactions.length === 0" class="text-center text-gray-400 mt-10 p-10 bg-white rounded-3xl border border-dashed border-gray-200">
                    <i class="fas fa-calendar-day text-3xl mb-2 opacity-20"></i>
                    <p class="text-sm">Nenhum gasto registrado.</p>
                </div>
                
                <div v-for="t in filteredTransactions" :key="t.id" class="expense-item bg-white shadow-sm border border-gray-100 flex justify-between items-center animate-fade-in">
                    <div class="flex items-center gap-3">
                        <div class="expense-icon rounded-full flex items-center justify-center text-white shadow-sm" :class="t.type === 'credit' ? 'bg-indigo-500' : 'bg-orange-500'">
                            <i class="fas" :class="t.type === 'credit' ? 'fa-credit-card' : 'fa-money-bill-wave'"></i>
                        </div>
                        <div class="leading-tight">
                            <p class="font-bold text-gray-800 text-sm truncate max-w-[150px]">{{ t.description || 'Sem descrição' }}</p>
                            <p class="text-[11px] text-gray-400 font-medium">
                                <span class="text-emerald-600 font-bold">{{ t.category || 'Outros' }}</span> • {{ formatDateShort(t.date) }}
                            </p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-gray-900 text-base">{{ formatCurrency(t.amount) }}</span>
                        <button @click="editTransaction(t)" class="text-gray-200 hover:text-emerald-500 p-2 transition-colors"><i class="fas fa-pen text-xs"></i></button>
                    </div>
                </div>
            </main>

            <!-- ANÁLISE -->
            <main v-if="activeTab === 'categories'" class="flex-1 overflow-y-auto p-5 space-y-6 no-scrollbar pb-32 animate-fade-in">
                
                <div v-if="viewingCategory" class="space-y-4 animate-fade-in">
                    <div class="flex items-center gap-2 mb-2">
                        <button @click="viewingCategory = null" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 text-emerald-600">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <span class="font-bold text-gray-500 text-sm uppercase tracking-widest">Gastos em {{ viewingCategory }}</span>
                    </div>

                    <div v-for="t in categoryTransactions" :key="t.id" class="expense-item bg-white shadow-sm border border-gray-100 flex justify-between items-center animate-fade-in">
                        <div class="flex items-center gap-3">
                            <div class="expense-icon rounded-full flex items-center justify-center text-white shadow-sm" :class="t.type === 'credit' ? 'bg-indigo-500' : 'bg-orange-500'">
                                <i class="fas" :class="t.type === 'credit' ? 'fa-credit-card' : 'fa-money-bill-wave'"></i>
                            </div>
                            <div class="leading-tight">
                                <p class="font-bold text-gray-800 text-sm truncate max-w-[150px]">{{ t.description || 'Sem descrição' }}</p>
                                <p class="text-[11px] text-gray-400 font-medium">{{ formatDateShort(t.date) }}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-gray-900 text-base">{{ formatCurrency(t.amount) }}</span>
                            <button @click="editTransaction(t)" class="text-gray-200 hover:text-emerald-500 p-2 transition-colors"><i class="fas fa-pen text-xs"></i></button>
                        </div>
                    </div>
                </div>

                <div v-else class="space-y-6 animate-fade-in">
                    <div class="flex bg-gray-200 rounded-xl p-1 text-xs font-bold">
                        <button @click="chartFilter = 'all'" class="flex-1 py-2 rounded-lg" :class="chartFilter === 'all' ? 'bg-white shadow text-emerald-600' : 'text-gray-500'">Todos</button>
                        <button @click="chartFilter = 'debit'" class="flex-1 py-2 rounded-lg" :class="chartFilter === 'debit' ? 'bg-white shadow text-orange-600' : 'text-gray-500'">Débito</button>
                        <button @click="chartFilter = 'credit'" class="flex-1 py-2 rounded-lg" :class="chartFilter === 'credit' ? 'bg-white shadow text-indigo-600' : 'text-gray-500'">Crédito</button>
                    </div>

                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 relative min-h-[250px] flex items-center justify-center">
                        <canvas id="categoryChart"></canvas>
                    </div>

                    <button @click="categorizeWithAI" :disabled="isCategorizing" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 shadow-lg disabled:opacity-50">
                        <i class="fas" :class="isCategorizing ? 'fa-circle-notch fa-spin' : 'fa-wand-magic-sparkles'"></i>
                        {{ isCategorizing ? 'Categorizando...' : 'Categorizar com Inteligência Artificial' }}
                    </button>

                    <div class="space-y-2">
                        <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Divisão de Custos</h3>
                        <div v-for="cat in categoryData" :key="cat.name" @click="viewingCategory = cat.name" class="bg-white p-4 rounded-2xl border border-gray-100 flex justify-between items-center shadow-sm active:scale-95 transition-transform cursor-pointer">
                            <div class="flex flex-col">
                                <span class="font-bold text-gray-800 text-sm">{{ cat.name }}</span>
                                <span class="text-[10px] text-gray-400 uppercase font-black">{{ cat.count }} Transações</span>
                            </div>
                            <div class="text-right flex items-center gap-3">
                                <div class="flex flex-col">
                                    <div class="font-bold text-emerald-600 text-sm">{{ formatCurrency(cat.value) }}</div>
                                    <div class="text-[10px] text-gray-400 font-bold">{{ cat.percentage }}%</div>
                                </div>
                                <i class="fas fa-chevron-right text-gray-200 text-xs"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- NAVBAR -->
            <nav class="bottom-nav">
                <button @click="activeTab = 'list'" class="nav-item" :class="{active: activeTab === 'list'}">
                    <i class="fas fa-wallet text-xl mb-1"></i>
                    <span>LISTA</span>
                </button>
                <div class="w-20"></div>
                <button @click="activeTab = 'categories'" class="nav-item" :class="{active: activeTab === 'categories'}">
                    <i class="fas fa-chart-pie text-xl mb-1"></i>
                    <span>CATEGORIAS</span>
                </button>
            </nav>

            <button @click="openModal" class="fixed bottom-7 left-1/2 -translate-x-1/2 w-16 h-16 bg-emerald-600 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl z-50 border-4 border-white">
                <i class="fas fa-plus"></i>
            </button>

            <!-- MODAL LANÇAMENTO -->
            <div v-if="showModal" class="fixed inset-0 bg-black/60 z-[60] flex items-end sm:items-center justify-center backdrop-blur-sm" @click.self="closeModal">
                <div class="bg-white w-full max-lg p-6 rounded-t-[2.5rem] sm:rounded-3xl shadow-2xl animate-slide-up pb-safe">
                    <h2 class="text-xl font-bold text-gray-800 mb-6">{{ editingId ? 'Editar Gasto' : 'Novo Gasto' }}</h2>
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between items-center ml-1"><label class="text-[10px] font-bold text-gray-400 uppercase">Valor</label><button @click="showCalculator = true" class="text-emerald-600 font-bold text-[10px] uppercase flex items-center gap-1"><i class="fas fa-calculator"></i> Calculadora</button></div>
                            <input type="tel" inputmode="numeric" :value="formattedAmountDisplay" @input="handleAmountInput" class="w-full p-4 bg-gray-50 rounded-2xl font-bold text-2xl outline-none" placeholder="0,00">
                        </div>
                        <div><label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Descrição</label><input type="text" v-model="newTransaction.description" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-base font-semibold" placeholder="Ex: Supermercado..."></div>
                        <div class="grid grid-cols-2 gap-3 mt-2"><button @click="newTransaction.type = 'debit'" class="p-4 rounded-2xl border-2 font-bold transition-all" :class="newTransaction.type === 'debit' ? 'border-orange-500 text-orange-600 bg-orange-50 shadow-inner' : 'border-gray-100 text-gray-300'">DÉBITO</button><button @click="newTransaction.type = 'credit'" class="p-4 rounded-2xl border-2 font-bold transition-all" :class="newTransaction.type === 'credit' ? 'border-indigo-500 text-indigo-600 bg-indigo-50 shadow-inner' : 'border-gray-100 text-gray-300'">CRÉDITO</button></div>
                        <button @click="saveTransaction" class="w-full bg-emerald-600 text-white py-5 rounded-2xl font-bold text-lg shadow-lg mt-4">Salvar Gasto</button>
                        <button v-if="editingId" @click="deleteTransaction(editingId)" class="w-full text-red-500 text-xs font-black py-2 uppercase tracking-widest">Excluir Permanente</button>
                    </div>
                </div>
            </div>

            <!-- CALCULADORA -->
            <div v-if="showCalculator" class="fixed inset-0 bg-black/60 z-[70] flex items-end sm:items-center justify-center backdrop-blur-md" @click.self="showCalculator = false">
                <div class="bg-white w-full max-w-sm p-6 rounded-t-[2.5rem] sm:rounded-3xl shadow-2xl animate-slide-up pb-safe">
                    <div class="bg-gray-100 p-6 rounded-2xl mb-6 text-right"><div class="text-gray-400 text-xs font-bold h-4">{{ calcHistory }}</div><div class="text-3xl font-black text-emerald-600 truncate">{{ calcDisplay }}</div></div>
                    <div class="grid grid-cols-4 gap-2">
                        <button @click="calcClear" class="calc-btn text-red-500">C</button><button @click="calcBackspace" class="calc-btn text-gray-400"><i class="fas fa-backspace"></i></button><button @click="calcAppend('/')" class="calc-btn calc-btn-op">÷</button><button @click="calcAppend('*')" class="calc-btn calc-btn-op">×</button>
                        <button @click="calcAppend('7')" class="calc-btn">7</button><button @click="calcAppend('8')" class="calc-btn">8</button><button @click="calcAppend('9')" class="calc-btn">9</button><button @click="calcAppend('-')" class="calc-btn calc-btn-op">-</button>
                        <button @click="calcAppend('4')" class="calc-btn">4</button><button @click="calcAppend('5')" class="calc-btn">5</button><button @click="calcAppend('6')" class="calc-btn">6</button><button @click="calcAppend('+')" class="calc-btn calc-btn-op">+</button>
                        <button @click="calcAppend('1')" class="calc-btn">1</button><button @click="calcAppend('2')" class="calc-btn">2</button><button @click="calcAppend('3')" class="calc-btn">3</button><button @click="calcCalculate" class="calc-btn bg-indigo-500 text-white">=</button>
                        <button @click="calcAppend('0')" class="calc-btn col-span-2">0</button><button @click="calcAppend('.')" class="calc-btn">.</button><button @click="useCalcResult" class="calc-btn bg-emerald-600 text-white"><i class="fas fa-check"></i></button>
                    </div>
                </div>
            </div>

            <!-- CONFIGS -->
            <div v-if="showSettings" class="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-6 backdrop-blur-md" @click.self="showSettings = false">
                <div class="bg-white w-full max-w-xs p-8 rounded-3xl shadow-2xl">
                    <h3 class="font-bold text-lg mb-2">Limite do Mês</h3>
                    <input type="number" v-model="tempLimit" class="w-full p-4 bg-gray-100 rounded-2xl mb-6 font-bold text-xl outline-none">
                    <button @click="saveLimit" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-lg">Definir Meta</button>
                </div>
            </div>
        </template>
    </div>

    <script type="module">
        const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, deleteDoc, updateDoc, getDoc, enableIndexedDbPersistence } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = { apiKey: "AIzaSyBynG1L1voQ-GJnjwv7KeKV6p64eDxD8KY", authDomain: "gastosmensais-3d721.firebaseapp.com", projectId: "gastosmensais-3d721", storageBucket: "gastosmensais-3d721.firebasestorage.app", messagingSenderId: "564092336226", appId: "1:564092336226:web:8d68fb169fc09dce84793b" };
        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);
        const appId = 'gastosmensais-3d721';

        // Persistência Offline para carregamento instantâneo de dados
        enableIndexedDbPersistence(db).catch(() => {});

        const possibleCategories = ["Alimentação", "Supermercado", "Transporte", "Saúde", "Educação", "Lazer", "Assinaturas", "Moradia", "Compras", "Serviços", "Pets", "Imprevistos", "Outros"];

        createApp({
            setup() {
                const appReady = ref(false);
                const user = ref(null);
                const transactions = ref([]);
                const monthlyLimitsMap = ref({}); 
                const learnedPatterns = ref({}); 
                const defaultLimit = ref(2000);
                const loading = ref(false);
                const currentDate = ref(new Date());
                const activeTab = ref('list');
                const chartFilter = ref('all');
                const isCategorizing = ref(false);
                const viewingCategory = ref(null);
                let myChart = null;

                const loginEmail = ref('douglasrgomes@gmail.com');
                const loginPassword = ref('');
                const isLoggingIn = ref(false);
                const showModal = ref(false);
                const showSettings = ref(false);
                const tempLimit = ref(2000);
                const editingId = ref(null);
                const newTransaction = ref({ amount: 0, description: '', type: 'debit', category: '', date: new Date() });
                const showCalculator = ref(false);
                const calcDisplay = ref('0');
                const calcHistory = ref('');

                // Lógica de Meta Restaurada
                const expectedProgress = computed(() => { 
                    const now = new Date(); 
                    const totalDays = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(); 
                    const currentDay = now.getDate(); 
                    return (currentDay / totalDays) * 100; 
                });
                const progressBarColor = computed(() => progressPercentage.value > 95 ? 'bg-red-600' : progressPercentage.value > expectedProgress.value ? 'bg-orange-500' : 'bg-emerald-300');

                const formattedAmountDisplay = computed(() => newTransaction.value.amount === 0 ? '' : newTransaction.value.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
                const currentMonthDisplay = computed(() => new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(currentDate.value));
                const currentMonthKey = computed(() => { const m = currentDate.value.getMonth() + 1; const y = currentDate.value.getFullYear(); return `${y}-${m.toString().padStart(2, '0')}`; });
                const currentMonthlyLimit = computed(() => monthlyLimitsMap.value[currentMonthKey.value] ?? defaultLimit.value);
                
                const filteredTransactions = computed(() => {
                    const targetMonth = currentDate.value.getMonth();
                    const targetYear = currentDate.value.getFullYear();
                    return transactions.value.filter(t => {
                        const d = t.date.toDate();
                        return d.getMonth() === targetMonth && d.getFullYear() === targetYear;
                    }).sort((a, b) => b.date.toDate() - a.date.toDate());
                });

                const categoryTransactions = computed(() => !viewingCategory.value ? [] : filteredTransactions.value.filter(t => (t.category || 'Outros') === viewingCategory.value));
                const totalSpent = computed(() => filteredTransactions.value.reduce((acc, curr) => acc + (parseFloat(curr.amount) || 0), 0));
                const totalDebit = computed(() => filteredTransactions.value.filter(t => t.type === 'debit').reduce((acc, curr) => acc + (parseFloat(curr.amount) || 0), 0));
                const totalCredit = computed(() => filteredTransactions.value.filter(t => t.type === 'credit').reduce((acc, curr) => acc + (parseFloat(curr.amount) || 0), 0));
                const remainingBudget = computed(() => currentMonthlyLimit.value - totalSpent.value);
                const progressPercentage = computed(() => Math.min((totalSpent.value / (currentMonthlyLimit.value || 1)) * 100, 100));

                const categoryData = computed(() => {
                    let items = filteredTransactions.value;
                    if (chartFilter.value === 'debit') items = items.filter(t => t.type === 'debit');
                    if (chartFilter.value === 'credit') items = items.filter(t => t.type === 'credit');
                    const groups = items.reduce((acc, t) => { const cat = t.category || 'Outros'; if (!acc[cat]) acc[cat] = { value: 0, count: 0 }; acc[cat].value += t.amount; acc[cat].count++; return acc; }, {});
                    const totalValue = items.reduce((a, b) => a + b.amount, 0);
                    return Object.keys(groups).map(name => ({ name, value: groups[name].value, count: groups[name].count, percentage: totalValue > 0 ? ((groups[name].value / totalValue) * 100).toFixed(0) : 0 })).sort((a, b) => b.value - a.value);
                });

                // Funções Auxiliares
                const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
                const formatDateShort = (ts) => ts ? new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit' }).format(ts.toDate()) : '--';
                const changeMonth = (d) => { const newD = new Date(currentDate.value); newD.setMonth(newD.getMonth() + d); currentDate.value = newD; };
                const openModal = () => { editingId.value = null; newTransaction.value = { amount: 0, description: '', type: 'debit', category: '', date: new Date() }; showModal.value = true; };
                const closeModal = () => showModal.value = false;
                const editTransaction = (t) => { editingId.value = t.id; newTransaction.value = { ...t }; showModal.value = true; };
                const handleAmountInput = (e) => { let val = e.target.value.replace(/\D/g, ''); newTransaction.value.amount = val ? parseFloat(val) / 100 : 0; };
                const toggleSettings = () => { tempLimit.value = currentMonthlyLimit.value; showSettings.value = !showSettings.value; };
                const handleLogout = () => confirm('Sair?') && signOut(auth);
                const handleLogin = async () => { isLoggingIn.value = true; try { await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value); } catch (e) { alert("Erro"); } finally { isLoggingIn.value = false; } };

                const calcAppend = (btn) => { if (calcDisplay.value === '0' && !isNaN(btn)) calcDisplay.value = btn; else calcDisplay.value += btn; };
                const calcClear = () => { calcDisplay.value = '0'; calcHistory.value = ''; };
                const calcBackspace = () => { calcDisplay.value = calcDisplay.value.slice(0, -1) || '0'; };
                const calcCalculate = () => { try { const expression = calcDisplay.value.replace(/X/g, '*').replace(/,/g, '.'); calcHistory.value = calcDisplay.value + ' ='; calcDisplay.value = eval(expression).toString(); } catch (e) { calcDisplay.value = 'Erro'; } };
                const useCalcResult = () => { calcCalculate(); const res = parseFloat(calcDisplay.value); if (!isNaN(res)) newTransaction.value.amount = res; showCalculator.value = false; };

                const saveTransaction = async () => {
                    if (!newTransaction.value.description || newTransaction.value.amount <= 0 || !user.value) return;
                    const data = { ...newTransaction.value }; delete data.id;
                    try { if (editingId.value) await updateDoc(doc(db, 'artifacts', appId, 'users', user.value.uid, 'expenses', editingId.value), data); else await addDoc(collection(db, 'artifacts', appId, 'users', user.value.uid, 'expenses'), data); closeModal(); } catch (e) {}
                };

                const deleteTransaction = async (id) => { if (confirm("Excluir?") && user.value) { await deleteDoc(doc(db, 'artifacts', appId, 'users', user.value.uid, 'expenses', id)); closeModal(); } };
                const saveLimit = async () => { if (!user.value) return; await setDoc(doc(db, 'artifacts', appId, 'users', user.value.uid, 'settings', 'config'), { monthlyLimits: { ...monthlyLimitsMap.value, [currentMonthKey.value]: parseFloat(tempLimit.value) } }, { merge: true }); showSettings.value = false; };

                onMounted(() => {
                    onAuthStateChanged(auth, async (u) => {
                        user.value = u; appReady.value = true;
                        // Fecha splash-screen assim que detectamos o estado de login
                        setTimeout(() => document.getElementById('splash-screen')?.classList.add('hidden'), 200);
                        if (u) {
                            onSnapshot(doc(db, 'artifacts', appId, 'users', u.uid, 'settings', 'config'), (s) => { if (s.exists()) { defaultLimit.value = s.data().monthlyLimit || 2000; monthlyLimitsMap.value = s.data().monthlyLimits || {}; } });
                            onSnapshot(collection(db, 'artifacts', appId, 'users', u.uid, 'expenses'), (s) => { transactions.value = s.docs.map(d => ({ id: d.id, ...d.data() })); });
                        }
                    });
                    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
                });

                return { appReady, user, transactions, loading, loginEmail, loginPassword, isLoggingIn, handleLogin, handleLogout, showModal, showSettings, newTransaction, tempLimit, filteredTransactions, currentMonthDisplay, changeMonth, currentMonthlyLimit, formatCurrency, formatDateShort, openModal, closeModal, toggleSettings, saveLimit, saveTransaction, editTransaction, editingId, formattedAmountDisplay, handleAmountInput, remainingBudget, progressPercentage, progressBarColor, activeTab, categoryData, chartFilter, categorizeWithAI: () => {}, isCategorizing: false, totalSpent, totalDebit, totalCredit, possibleCategories, expectedProgress, showCalculator, calcDisplay, calcHistory, calcAppend, calcClear, calcBackspace, calcCalculate, useCalcResult, viewingCategory, categoryTransactions, deleteTransaction };
            }
        }).mount('#app');
    </script>
</body>
</html>
