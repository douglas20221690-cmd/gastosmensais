<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle de Gastos PWA</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="512x512" href="icon.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">
    
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #10b981; }
        [v-cloak] { display: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        #splash-screen {
            position: fixed; inset: 0; background: #10b981;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .pulse-logo { animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } }
        
        /* Layout intermediário solicitado */
        .expense-item { padding: 0.7rem 0.9rem; border-radius: 0.9rem; }
        .expense-icon { width: 2.3rem; height: 2.3rem; font-size: 0.85rem; }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; border-top: 1px solid #e5e7eb;
            display: flex; justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 40;
        }
        .nav-item {
            flex: 1; padding: 0.75rem 0; display: flex; flex-direction: column;
            align-items: center; font-size: 0.75rem; font-weight: 600;
            color: #9ca3af; transition: color 0.2s;
        }
        .nav-item.active { color: #10b981; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">

    <div id="splash-screen">
        <div class="bg-white/20 p-6 rounded-full mb-6 pulse-logo">
            <img src="icon.png?v=3" alt="Logo" class="w-20 h-20 object-contain">
        </div>
        <p class="text-white font-medium mt-4 opacity-80 text-sm">Organizando finanças...</p>
    </div>

    <div id="app" class="flex flex-col h-full relative" v-cloak>

        <!-- TELA DE LOGIN -->
        <div v-if="!user && appReady" class="absolute inset-0 z-50 bg-emerald-600 flex flex-col items-center justify-center p-6 animate-fade-in">
            <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-2xl">
                <div class="text-center mb-8">
                    <img src="icon.png?v=3" alt="Logo" class="w-20 h-20 mx-auto mb-4 bg-emerald-100 rounded-full p-3">
                    <h1 class="text-2xl font-bold text-gray-800">Minhas Finanças</h1>
                </div>
                <form @submit.prevent="handleLogin" class="space-y-4">
                    <input type="email" v-model="loginEmail" class="w-full px-4 py-3 bg-gray-50 rounded-lg border outline-none focus:ring-2 focus:ring-emerald-500" placeholder="E-mail" required>
                    <input type="password" v-model="loginPassword" class="w-full px-4 py-3 bg-gray-50 rounded-lg border outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Senha" required>
                    <div v-if="loginError" class="text-red-500 text-xs text-center p-2 bg-red-50 rounded">{{ loginError }}</div>
                    <button type="submit" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold shadow-lg" :disabled="isLoggingIn">Entrar</button>
                </form>
            </div>
        </div>
        
        <!-- CONTEÚDO PRINCIPAL -->
        <template v-else-if="user && appReady">
            <header class="bg-emerald-600 text-white p-5 shadow-lg rounded-b-3xl z-10 shrink-0 relative">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-lg font-bold flex items-center">
                        <img src="icon.png?v=3" class="w-7 h-7 mr-2 bg-white/20 rounded-full p-1">
                        {{ activeTab === 'list' ? 'Extrato' : 'Análise' }}
                    </h1>
                    <div class="flex gap-3">
                        <button @click="toggleSettings" class="opacity-80"><i class="fas fa-cog text-lg"></i></button>
                        <button @click="handleLogout" class="opacity-80"><i class="fas fa-sign-out-alt text-lg"></i></button>
                    </div>
                </div>

                <div class="flex items-center justify-between bg-emerald-700/40 rounded-xl p-1 mb-3">
                    <button @click="changeMonth(-1)" class="w-10 h-10 flex items-center justify-center"><i class="fas fa-chevron-left"></i></button>
                    <span class="font-bold text-base capitalize">{{ currentMonthDisplay }}</span>
                    <button @click="changeMonth(1)" class="w-10 h-10 flex items-center justify-center"><i class="fas fa-chevron-right"></i></button>
                </div>

                <div v-if="activeTab === 'list'" class="animate-fade-in">
                    <p class="text-emerald-100 text-xs mb-1">Disponível para Gastar</p>
                    <div class="text-2xl font-bold">{{ formatCurrency(remainingBudget) }}</div>
                    <div class="mt-3 h-2 bg-emerald-800/30 rounded-full overflow-hidden">
                        <div class="h-full transition-all duration-500" :class="progressBarColor" :style="{ width: progressPercentage + '%' }"></div>
                    </div>
                </div>
                
                <div v-else class="animate-fade-in py-1">
                    <div class="flex justify-between items-center bg-white/10 p-3 rounded-xl">
                        <span class="text-xs font-medium">Total do Mês</span>
                        <span class="text-xl font-bold">{{ formatCurrency(totalSpent) }}</span>
                    </div>
                </div>
            </header>

            <!-- ABA LISTA -->
            <main v-if="activeTab === 'list'" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar pb-28">
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-orange-50 p-3 rounded-2xl border border-orange-100 flex flex-col items-center">
                        <span class="text-[10px] text-orange-400 font-bold uppercase">Débito</span>
                        <span class="text-sm font-bold text-orange-700">{{ formatCurrency(totalDebit) }}</span>
                    </div>
                    <div class="bg-indigo-50 p-3 rounded-2xl border border-indigo-100 flex flex-col items-center">
                        <span class="text-[10px] text-indigo-400 font-bold uppercase">Crédito</span>
                        <span class="text-sm font-bold text-indigo-700">{{ formatCurrency(totalCredit) }}</span>
                    </div>
                </div>

                <div v-if="loading" class="text-center text-gray-400 mt-10"><i class="fas fa-spinner fa-spin text-xl"></i></div>
                <div v-else-if="filteredTransactions.length === 0" class="text-center text-gray-400 mt-10">Nenhum gasto este mês.</div>

                <div v-for="t in filteredTransactions" :key="t.id" class="expense-item bg-white shadow-sm border border-gray-100 flex justify-between items-center animate-fade-in">
                    <div class="flex items-center gap-3">
                        <div class="expense-icon rounded-full flex items-center justify-center text-white shadow-sm" :class="t.type === 'credit' ? 'bg-indigo-500' : 'bg-orange-500'">
                            <i class="fas" :class="t.type === 'credit' ? 'fa-credit-card' : 'fa-money-bill-wave'"></i>
                        </div>
                        <div class="leading-tight">
                            <p class="font-bold text-gray-700 text-sm truncate max-w-[160px]">{{ t.description || 'Sem descrição' }}</p>
                            <p class="text-[10px] text-gray-400 font-medium">
                                <span class="text-emerald-600 font-bold">{{ t.category || 'Outros' }}</span> • {{ formatDateShort(t.date) }}
                            </p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-gray-800 text-sm">{{ formatCurrency(t.amount) }}</span>
                        <button @click="editTransaction(t)" class="text-gray-300 hover:text-emerald-500 p-2"><i class="fas fa-pen text-[10px]"></i></button>
                    </div>
                </div>
            </main>

            <!-- ABA CATEGORIAS -->
            <main v-if="activeTab === 'categories'" class="flex-1 overflow-y-auto p-5 space-y-6 no-scrollbar pb-28 animate-fade-in">
                <div class="flex bg-gray-200 rounded-xl p-1 text-xs font-bold">
                    <button @click="chartFilter = 'all'" class="flex-1 py-2 rounded-lg transition-colors" :class="chartFilter === 'all' ? 'bg-white shadow text-emerald-600' : 'text-gray-500'">Todos</button>
                    <button @click="chartFilter = 'debit'" class="flex-1 py-2 rounded-lg transition-colors" :class="chartFilter === 'debit' ? 'bg-white shadow text-orange-600' : 'text-gray-500'">Débito</button>
                    <button @click="chartFilter = 'credit'" class="flex-1 py-2 rounded-lg transition-colors" :class="chartFilter === 'credit' ? 'bg-white shadow text-indigo-600' : 'text-gray-500'">Crédito</button>
                </div>

                <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 relative min-h-[300px] flex items-center justify-center">
                    <canvas id="categoryChart"></canvas>
                </div>

                <button @click="categorizeWithAI" :disabled="isCategorizing" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 shadow-lg active:scale-95 transition-all disabled:opacity-50">
                    <i class="fas" :class="isCategorizing ? 'fa-spinner fa-spin' : 'fa-wand-magic-sparkles'"></i>
                    {{ isCategorizing ? 'Organizando...' : 'Categorizar com IA' }}
                </button>

                <div class="space-y-3">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">Relatório Detalhado</h3>
                    <div v-for="cat in categoryData" :key="cat.name" class="bg-white p-4 rounded-2xl border border-gray-100 flex justify-between items-center shadow-sm">
                        <div class="flex flex-col">
                            <span class="font-bold text-gray-800">{{ cat.name }}</span>
                            <span class="text-[10px] text-gray-400 font-bold uppercase">{{ cat.count }} Itens</span>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-emerald-600">{{ formatCurrency(cat.value) }}</div>
                            <div class="text-[10px] text-gray-400 font-bold">{{ cat.percentage }}%</div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- NAVEGAÇÃO -->
            <nav class="bottom-nav">
                <button @click="activeTab = 'list'" class="nav-item" :class="{active: activeTab === 'list'}">
                    <i class="fas fa-list-ul text-lg mb-1"></i>
                    <span>LISTA</span>
                </button>
                <div class="w-20"></div>
                <button @click="activeTab = 'categories'" class="nav-item" :class="{active: activeTab === 'categories'}">
                    <i class="fas fa-chart-pie text-lg mb-1"></i>
                    <span>ANÁLISE</span>
                </button>
            </nav>

            <button @click="openModal" class="fixed bottom-7 left-1/2 -translate-x-1/2 w-16 h-16 bg-emerald-600 text-white rounded-full shadow-2xl flex items-center justify-center text-3xl hover:scale-105 active:scale-95 transition-transform z-50 border-4 border-white">
                <i class="fas fa-plus"></i>
            </button>

            <!-- MODAL ADICIONAR/EDITAR -->
            <div v-if="showModal" class="fixed inset-0 bg-black/60 z-[60] flex items-end sm:items-center justify-center backdrop-blur-md" @click.self="closeModal">
                <div class="bg-white w-full max-w-lg p-8 rounded-t-[2.5rem] sm:rounded-3xl shadow-2xl animate-slide-up pb-safe">
                    <h2 class="text-xl font-bold text-gray-800 mb-6">{{ editingId ? 'Editar Gasto' : 'Novo Gasto' }}</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Valor</label>
                            <input type="tel" inputmode="numeric" :value="formattedAmountDisplay" @input="handleAmountInput" class="w-full p-4 bg-gray-50 rounded-2xl font-bold text-2xl outline-none focus:ring-2 focus:ring-emerald-500" placeholder="0,00">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Descrição</label>
                            <input type="text" v-model="newTransaction.description" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-base focus:ring-2 focus:ring-emerald-500" placeholder="O que você comprou?">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Categoria (Editar Manual)</label>
                            <input type="text" v-model="newTransaction.category" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-base focus:ring-2 focus:ring-emerald-500" placeholder="Ex: Alimentação">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <button @click="newTransaction.type = 'debit'" class="p-3 rounded-2xl border-2 font-bold transition-all" :class="newTransaction.type === 'debit' ? 'border-orange-500 text-orange-600 bg-orange-50' : 'border-gray-100 text-gray-300'">DÉBITO</button>
                            <button @click="newTransaction.type = 'credit'" class="p-3 rounded-2xl border-2 font-bold transition-all" :class="newTransaction.type === 'credit' ? 'border-indigo-500 text-indigo-600 bg-indigo-50' : 'border-gray-100 text-gray-300'">CRÉDITO</button>
                        </div>
                        <button @click="saveTransaction" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-lg mt-4 active:scale-95">Salvar Registro</button>
                        <button v-if="editingId" @click="deleteTransaction(editingId)" class="w-full text-red-500 text-xs font-bold py-2 tracking-widest uppercase">Excluir</button>
                    </div>
                </div>
            </div>

            <!-- CONFIGURAÇÕES -->
            <div v-if="showSettings" class="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-6 backdrop-blur-md" @click.self="showSettings = false">
                <div class="bg-white w-full max-w-xs p-8 rounded-3xl shadow-2xl">
                    <h3 class="font-bold text-lg mb-2">Limite do Mês</h3>
                    <p class="text-gray-400 text-xs mb-6">Defina quanto você pode gastar em <span class="capitalize text-emerald-600 font-bold">{{ currentMonthDisplay }}</span>.</p>
                    <input type="number" v-model="tempLimit" class="w-full p-4 bg-gray-100 rounded-2xl mb-6 font-bold text-xl outline-none focus:ring-2 focus:ring-emerald-500">
                    <button @click="saveLimit" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-lg">Salvar Limite</button>
                </div>
            </div>
        </template>
    </div>

    <script type="module">
        const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, deleteDoc, updateDoc, getDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBynG1L1voQ-GJnjwv7KeKV6p64eDxD8KY",
            authDomain: "gastosmensais-3d721.firebaseapp.com",
            projectId: "gastosmensais-3d721",
            storageBucket: "gastosmensais-3d721.firebasestorage.app",
            messagingSenderId: "564092336226",
            appId: "1:564092336226:web:8d68fb169fc09dce84793b"
        };
        
        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);
        const appId = 'gastosmensais-3d721'; 

        createApp({
            setup() {
                const appReady = ref(false);
                const user = ref(null);
                const transactions = ref([]);
                const monthlyLimitsMap = ref({}); 
                const defaultLimit = ref(2000);
                const loading = ref(false);
                const currentDate = ref(new Date());
                const activeTab = ref('list');
                const chartFilter = ref('all');
                const isCategorizing = ref(false);
                let myChart = null;

                const loginEmail = ref('douglasrgomes@gmail.com');
                const loginPassword = ref('');
                const loginError = ref('');
                const isLoggingIn = ref(false);

                const showModal = ref(false);
                const showSettings = ref(false);
                const tempLimit = ref(2000);
                const editingId = ref(null);
                const newTransaction = ref({ amount: 0, description: '', type: 'debit', category: '', date: new Date() });

                const formattedAmountDisplay = computed(() => {
                    if (newTransaction.value.amount === 0) return '';
                    return newTransaction.value.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                });

                const currentMonthKey = computed(() => {
                    const m = currentDate.value.getMonth() + 1;
                    const y = currentDate.value.getFullYear();
                    return `${y}-${m.toString().padStart(2, '0')}`;
                });
                
                const currentMonthDisplay = computed(() => new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(currentDate.value));
                const currentMonthlyLimit = computed(() => monthlyLimitsMap.value[currentMonthKey.value] ?? defaultLimit.value);

                const filteredTransactions = computed(() => {
                    const targetMonth = currentDate.value.getMonth();
                    const targetYear = currentDate.value.getFullYear();
                    return transactions.value.filter(t => {
                        const d = t.date.toDate();
                        return d.getMonth() === targetMonth && d.getFullYear() === targetYear;
                    }).sort((a, b) => b.date.toDate() - a.date.toDate());
                });

                const totalSpent = computed(() => filteredTransactions.value.reduce((acc, curr) => acc + (parseFloat(curr.amount) || 0), 0));
                const totalDebit = computed(() => filteredTransactions.value.filter(t => t.type === 'debit').reduce((acc, curr) => acc + (parseFloat(curr.amount) || 0), 0));
                const totalCredit = computed(() => filteredTransactions.value.filter(t => t.type === 'credit').reduce((acc, curr) => acc + (parseFloat(curr.amount) || 0), 0));
                const remainingBudget = computed(() => currentMonthlyLimit.value - totalSpent.value);
                const progressPercentage = computed(() => Math.min((totalSpent.value / (currentMonthlyLimit.value || 1)) * 100, 100));
                const progressBarColor = computed(() => progressPercentage.value > 85 ? 'bg-red-500' : (progressPercentage.value > 60 ? 'bg-yellow-400' : 'bg-emerald-300'));

                const categoryData = computed(() => {
                    let items = filteredTransactions.value;
                    if (chartFilter.value === 'debit') items = items.filter(t => t.type === 'debit');
                    if (chartFilter.value === 'credit') items = items.filter(t => t.type === 'credit');

                    const groups = items.reduce((acc, t) => {
                        const cat = t.category || 'Outros';
                        if (!acc[cat]) acc[cat] = { value: 0, count: 0 };
                        acc[cat].value += t.amount;
                        acc[cat].count++;
                        return acc;
                    }, {});

                    const totalValue = items.reduce((a, b) => a + b.amount, 0);

                    return Object.keys(groups).map(name => ({
                        name,
                        value: groups[name].value,
                        count: groups[name].count,
                        percentage: totalValue > 0 ? ((groups[name].value / totalValue) * 100).toFixed(0) : 0
                    })).sort((a, b) => b.value - a.value);
                });

                const renderChart = () => {
                    const ctx = document.getElementById('categoryChart');
                    if (!ctx) return;
                    if (myChart) myChart.destroy();

                    const data = categoryData.value;
                    if (data.length === 0) return;

                    myChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: data.map(d => d.name),
                            datasets: [{
                                data: data.map(d => d.value),
                                backgroundColor: [
                                    '#10b981', '#6366f1', '#f59e0b', '#ec4899', '#3b82f6', 
                                    '#8b5cf6', '#ef4444', '#94a3b8', '#14b8a6', '#f43f5e',
                                    '#84cc16', '#0ea5e9', '#d946ef'
                                ],
                                borderWidth: 4,
                                borderColor: '#ffffff'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '65%',
                            plugins: {
                                legend: { position: 'bottom', labels: { boxWidth: 10, padding: 15, font: { size: 10, weight: 'bold' } } }
                            }
                        }
                    });
                };

                const categorizeWithAI = async () => {
                    if (isCategorizing.value || !user.value) return;
                    isCategorizing.value = true;
                    
                    try {
                        const configSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'gemini'));
                        const apiKey = configSnap.exists() ? configSnap.data().apiKey : '';
                        
                        if (!apiKey) throw new Error("Chave Gemini não configurada.");

                        const itemsToCategorize = filteredTransactions.value
                            .filter(t => !t.category || t.category === 'Outros')
                            .slice(0, 15);

                        if (itemsToCategorize.length === 0) {
                            alert("Todos os gastos já estão organizados!");
                            isCategorizing.value = false;
                            return;
                        }

                        const names = itemsToCategorize.map(t => t.description).join(", ");
                        
                        // Prompt atualizado com a lista específica de 13 categorias
                        const prompt = `Você é um assistente financeiro brasileiro. Analise os nomes de gastos abaixo e classifique CADA UM deles em exatamente UMA das seguintes categorias:
                        Alimentação, Supermercado, Transporte, Saúde, Educação, Lazer, Assinaturas, Moradia, Compras, Serviços, Pets, Imprevistos, Outros.

                        Diferença importante:
                        - Alimentação: restaurantes, lanches, delivery (Ifood, Burger King).
                        - Supermercado: compras de mercado (Carrefour, Pão de Açúcar, Mateus, Fribal).
                        - Serviços: conta de internet, luz, água, manutenção.
                        - Moradia: aluguel, condomínio.

                        Gastos para classificar: ${names}

                        Retorne APENAS um objeto JSON onde a CHAVE é o nome do gasto e o VALOR é a categoria escolhida. Exemplo: {"Uber": "Transporte"}`;

                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                        });

                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        const jsonMatch = text.match(/\{[\s\S]*\}/);
                        if (!jsonMatch) throw new Error("IA retornou resposta inválida.");
                        const mapping = JSON.parse(jsonMatch[0]);

                        for (const item of itemsToCategorize) {
                            const cat = mapping[item.description] || mapping[Object.keys(mapping).find(k => item.description.includes(k))];
                            if (cat) {
                                await updateDoc(doc(db, 'artifacts', appId, 'users', user.value.uid, 'expenses', item.id), {
                                    category: cat
                                });
                            }
                        }
                    } catch (e) {
                        console.error("Erro na IA:", e);
                        alert("Houve um problema ao falar com a IA. Tente novamente.");
                    } finally {
                        isCategorizing.value = false;
                    }
                };

                watch([activeTab, chartFilter, categoryData], () => {
                    if (activeTab.value === 'categories') nextTick(() => renderChart());
                });

                const handleAmountInput = (e) => {
                    let val = e.target.value.replace(/\D/g, '');
                    newTransaction.value.amount = val ? parseFloat(val) / 100 : 0;
                };
                const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
                const formatDateShort = (ts) => ts ? new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit' }).format(ts.toDate()) : '--';
                const changeMonth = (d) => {
                    const newD = new Date(currentDate.value);
                    newD.setMonth(newD.getMonth() + d);
                    currentDate.value = newD;
                };

                const openModal = () => {
                    editingId.value = null;
                    newTransaction.value = { amount: 0, description: '', type: 'debit', category: '', date: new Date() };
                    showModal.value = true;
                };
                const editTransaction = (t) => {
                    editingId.value = t.id;
                    newTransaction.value = { ...t };
                    showModal.value = true;
                };
                const closeModal = () => showModal.value = false;

                const saveTransaction = async () => {
                    if (!newTransaction.value.description || newTransaction.value.amount <= 0 || !user.value) return;
                    const data = { ...newTransaction.value };
                    delete data.id;
                    try {
                        if (editingId.value) await updateDoc(doc(db, 'artifacts', appId, 'users', user.value.uid, 'expenses', editingId.value), data);
                        else await addDoc(collection(db, 'artifacts', appId, 'users', user.value.uid, 'expenses'), data);
                        closeModal();
                    } catch (e) { console.error(e); }
                };

                const deleteTransaction = async (id) => {
                    if (confirm("Deseja apagar este gasto?") && user.value) {
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', user.value.uid, 'expenses', id));
                        closeModal();
                    }
                };

                const toggleSettings = () => {
                    tempLimit.value = currentMonthlyLimit.value;
                    showSettings.value = !showSettings.value;
                };
                const saveLimit = async () => {
                    if (!user.value) return;
                    const ref = doc(db, 'artifacts', appId, 'users', user.value.uid, 'settings', 'config');
                    const limits = { ...monthlyLimitsMap.value };
                    limits[currentMonthKey.value] = parseFloat(tempLimit.value);
                    await setDoc(ref, { monthlyLimits: limits }, { merge: true });
                    showSettings.value = false;
                };

                const handleLogin = async () => {
                    isLoggingIn.value = true;
                    try { await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value); } 
                    catch (error) { loginError.value = "Acesso negado."; } 
                    finally { isLoggingIn.value = false; }
                };
                const handleLogout = () => signOut(auth);

                onMounted(() => {
                    onAuthStateChanged(auth, (u) => {
                        user.value = u;
                        appReady.value = true;
                        setTimeout(() => {
                             document.getElementById('splash-screen')?.classList.add('hidden');
                        }, 400);
                        if (u) {
                            loading.value = true;
                            onSnapshot(doc(db, 'artifacts', appId, 'users', u.uid, 'settings', 'config'), (s) => {
                                if (s.exists()) {
                                    defaultLimit.value = s.data().monthlyLimit || 2000;
                                    monthlyLimitsMap.value = s.data().monthlyLimits || {};
                                }
                            });
                            onSnapshot(collection(db, 'artifacts', appId, 'users', u.uid, 'expenses'), (s) => {
                                transactions.value = s.docs.map(d => ({ id: d.id, ...d.data() }));
                                loading.value = false;
                            });
                        }
                    });
                });

                return {
                    appReady, user, transactions, loading, loginEmail, loginPassword, loginError, isLoggingIn, handleLogin, handleLogout,
                    showModal, showSettings, newTransaction, tempLimit, filteredTransactions, currentMonthDisplay, changeMonth, 
                    currentMonthlyLimit, formatCurrency, formatDateShort, openModal, closeModal, toggleSettings, 
                    saveLimit, saveTransaction, deleteTransaction, editTransaction, editingId,
                    formattedAmountDisplay, handleAmountInput, remainingBudget, progressPercentage, progressBarColor,
                    activeTab, categoryData, chartFilter, categorizeWithAI, isCategorizing, totalSpent, totalDebit, totalCredit
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
