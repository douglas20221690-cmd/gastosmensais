<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle de Gastos Otimizado</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="512x512" href="icon.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">
    
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #10b981; }
        [v-cloak] { display: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        #splash-screen {
            position: fixed; inset: 0; background: #10b981;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.3s ease, visibility 0.3s;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .expense-item { padding: 0.9rem 1.1rem; border-radius: 1.2rem; }
        .calc-btn {
            background: #f3f4f6; padding: 1.2rem 0; border-radius: 1rem;
            font-weight: 800; font-size: 1.2rem; display: flex;
            align-items: center; justify-content: center; transition: background 0.1s;
        }
        .calc-btn:active { background: #e5e7eb; scale: 0.95; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">

    <div id="splash-screen">
        <div class="bg-white/20 p-6 rounded-full mb-6">
            <img src="icon.png?v=3" alt="Logo" class="w-16 h-16 object-contain">
        </div>
        <p class="text-white font-medium opacity-80 text-sm">Atualizando sistema...</p>
    </div>

    <div id="app" class="flex flex-col h-full relative" v-cloak>

        <!-- LOGIN -->
        <div v-if="appReady && !user" class="absolute inset-0 z-50 bg-emerald-600 flex flex-col items-center justify-center p-6 animate-fade-in">
            <div class="bg-white w-full max-sm p-8 rounded-3xl shadow-2xl">
                <div class="text-center mb-8">
                    <img src="icon.png?v=3" alt="Logo" class="w-16 h-16 mx-auto mb-4 bg-emerald-100 rounded-full p-2">
                    <h1 class="text-xl font-bold text-gray-800">Minhas Finanças</h1>
                </div>
                <form @submit.prevent="handleLogin" class="space-y-4">
                    <input type="email" v-model="loginEmail" class="w-full px-4 py-3 bg-gray-50 rounded-lg border outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="E-mail" required>
                    <input type="password" v-model="loginPassword" class="w-full px-4 py-3 bg-gray-50 rounded-lg border outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="Senha" required>
                    <button type="submit" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold shadow-lg" :disabled="isLoggingIn">Entrar</button>
                </form>
            </div>
        </div>
        
        <!-- APP -->
        <template v-else-if="user && appReady">
            <header class="bg-emerald-600 text-white p-5 shadow-lg rounded-b-3xl z-10 shrink-0">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-lg font-bold flex items-center">
                        <img src="icon.png?v=3" class="w-7 h-7 mr-2 bg-white/20 rounded-full p-1">
                        Financeiro
                    </h1>
                    <div class="flex gap-4">
                        <button @click="toggleSettings" class="opacity-80" title="Configurações"><i class="fas fa-cog"></i></button>
                        <button @click="handleLogout" class="opacity-80" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>

                <div class="flex items-center justify-between bg-emerald-700/40 rounded-xl p-1 mb-3">
                    <button @click="changeMonth(-1)" class="w-9 h-9 flex items-center justify-center"><i class="fas fa-chevron-left text-xs"></i></button>
                    <span class="font-bold text-sm capitalize">{{ currentMonthDisplay }}</span>
                    <button @click="changeMonth(1)" class="w-9 h-9 flex items-center justify-center"><i class="fas fa-chevron-right text-xs"></i></button>
                </div>

                <!-- DASHBOARD -->
                <div class="animate-fade-in space-y-1">
                    <div v-if="isSyncing" class="text-center py-2 bg-white/10 rounded-lg animate-pulse">
                        <p class="text-[10px] font-bold uppercase tracking-widest text-emerald-200">Sincronizando Mês...</p>
                    </div>
                    <div v-else class="flex justify-between items-end">
                        <div>
                            <p class="text-emerald-100 text-[10px] uppercase font-bold tracking-wider mb-1">Saldo Livre</p>
                            <div class="text-3xl font-bold leading-none">{{ formatCurrency(remainingBudget) }}</div>
                        </div>
                        <div class="text-right">
                            <p class="text-emerald-100 text-[10px] uppercase font-bold tracking-wider mb-1">Uso do Limite</p>
                            <div class="text-lg font-bold leading-none">{{ progressPercentage.toFixed(0) }}%</div>
                        </div>
                    </div>
                    
                    <div class="mt-3 h-2 bg-emerald-800/30 rounded-full overflow-hidden relative">
                        <div class="h-full transition-all duration-500 absolute left-0 top-0 z-10" :class="progressBarColor" :style="{ width: progressPercentage + '%' }"></div>
                    </div>
                    
                    <div class="flex justify-between text-[10px] text-emerald-100 font-bold uppercase mt-1">
                        <span>Gasto: {{ formatCurrency(totalSpent) }}</span>
                        <span>Limite: {{ formatCurrency(currentMonthlyLimit) }}</span>
                    </div>
                </div>
            </header>

            <!-- LANÇAMENTO RÁPIDO (TELA INICIAL) -->
            <div class="px-4 pt-4 shrink-0">
                <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm space-y-2">
                    <div class="flex gap-2 items-center">
                        <input type="tel" inputmode="numeric" :value="formattedAmountDisplay" @input="handleAmountInput" 
                               class="flex-1 min-w-0 px-4 py-3 bg-gray-50 rounded-xl font-bold text-gray-800 outline-none placeholder:text-gray-300" 
                               placeholder="0,00">
                        <div class="flex bg-gray-50 rounded-xl p-1 gap-1 h-[52px] items-center shrink-0 mr-1.5">
                            <button @click="newTransaction.type = 'debit'" class="px-3.5 h-full rounded-lg text-[10px] font-black uppercase" :class="newTransaction.type === 'debit' ? 'bg-orange-500 text-white shadow-md' : 'text-gray-300'">Déb</button>
                            <button @click="newTransaction.type = 'credit'" class="px-3.5 h-full rounded-lg text-[10px] font-black uppercase" :class="newTransaction.type === 'credit' ? 'bg-indigo-500 text-white shadow-md' : 'text-gray-300'">Cré</button>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" v-model="newTransaction.description" class="flex-1 px-4 py-3 bg-gray-50 rounded-xl text-sm font-semibold text-gray-800 outline-none placeholder:text-gray-300" placeholder="Descrição do gasto">
                        <button @click="saveTransaction" class="bg-emerald-600 text-white px-6 rounded-xl font-black text-xs uppercase shadow-lg active:scale-95">Salvar</button>
                    </div>
                </div>
            </div>

            <!-- LISTA DE GASTOS -->
            <main class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar pb-24">
                <div v-if="transactions.length === 0 && !isSyncing" class="text-center py-10 bg-white rounded-3xl border border-dashed text-gray-400 text-sm">
                    Nenhum gasto registrado.
                </div>

                <div v-for="t in sortedTransactions" :key="t.id" class="expense-item bg-white shadow-sm border border-gray-100 flex justify-between items-center animate-fade-in mb-2">
                    <div class="flex items-center gap-3">
                        <div class="expense-icon w-10 h-10 rounded-full flex items-center justify-center text-white text-xs shadow-sm" :class="t.type === 'credit' ? 'bg-indigo-500' : 'bg-orange-500'">
                            <i class="fas" :class="t.type === 'credit' ? 'fa-credit-card' : 'fa-money-bill-wave'"></i>
                        </div>
                        <div class="leading-tight">
                            <p class="font-bold text-gray-800 text-sm truncate max-w-[150px]">{{ t.description || 'Gasto' }}</p>
                            <p class="text-[11px] text-gray-400 font-medium">{{ formatDateShort(t.date) }}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-gray-900 text-base">{{ formatCurrency(t.amount) }}</span>
                        <button @click="editTransaction(t)" class="text-gray-200 p-2"><i class="fas fa-pen text-xs"></i></button>
                    </div>
                </div>
            </main>

            <!-- MODAL EDIÇÃO/EXCLUSÃO (SÓ ABRE PARA EDITAR) -->
            <div v-if="showModal" class="fixed inset-0 bg-black/60 z-[60] flex items-end sm:items-center justify-center backdrop-blur-sm" @click.self="closeModal">
                <div class="bg-white w-full max-lg p-6 rounded-t-[2.5rem] sm:rounded-3xl shadow-2xl animate-slide-up pb-safe">
                    <h2 class="text-xl font-bold text-gray-800 mb-6">Editar Gasto</h2>
                    <div class="space-y-4">
                        <div class="flex gap-3">
                            <div class="flex-1">
                                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Valor</label>
                                <input type="tel" inputmode="numeric" :value="formattedAmountDisplay" @input="handleAmountInput" class="w-full p-4 bg-gray-50 rounded-2xl font-bold text-2xl outline-none" placeholder="0,00">
                            </div>
                            <div class="flex flex-col justify-end gap-2">
                                <button @click="newTransaction.type = 'debit'" class="px-4 py-2 rounded-xl border-2 font-bold text-xs" :class="newTransaction.type === 'debit' ? 'border-orange-500 text-orange-600 bg-orange-50' : 'border-gray-100 text-gray-300'">DÉBITO</button>
                                <button @click="newTransaction.type = 'credit'" class="px-4 py-2 rounded-xl border-2 font-bold text-xs" :class="newTransaction.type === 'credit' ? 'border-indigo-500 text-indigo-600 bg-indigo-50' : 'border-gray-100 text-gray-300'">CRÉDITO</button>
                            </div>
                        </div>
                        <input type="text" v-model="newTransaction.description" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-base font-semibold" placeholder="Descrição">
                        <button @click="saveTransaction" class="w-full bg-emerald-600 text-white py-5 rounded-2xl font-bold text-lg shadow-lg">Confirmar Alteração</button>
                        <button @click="handleDeleteRequest" class="w-full text-red-500 text-xs font-black py-4 mt-2 uppercase border-2 border-red-50 rounded-2xl tracking-widest active:bg-red-50">Excluir Permanente</button>
                    </div>
                </div>
            </div>

            <!-- CALCULADORA -->
            <div v-if="showCalculator" class="fixed inset-0 bg-black/60 z-[70] flex items-end sm:items-center justify-center backdrop-blur-md" @click.self="showCalculator = false">
                <div class="bg-white w-full max-sm p-6 rounded-t-[2.5rem] sm:rounded-3xl shadow-2xl animate-slide-up pb-safe">
                    <div class="bg-gray-100 p-6 rounded-2xl mb-6 text-right font-black text-3xl text-emerald-600 truncate">{{ calcDisplay }}</div>
                    <div class="grid grid-cols-4 gap-2">
                        <button v-for="b in ['C','←','÷','×','7','8','9','-','4','5','6','+','1','2','3','=','0','.','OK']" 
                                @click="handleCalc(b)" 
                                :class="['calc-btn', b === 'OK' ? 'bg-emerald-600 text-white' : b === '=' ? 'bg-indigo-500 text-white' : '']">
                            <span v-if="b === '←'"><i class="fas fa-backspace text-gray-400"></i></span>
                            <span v-else-if="b === 'OK'"><i class="fas fa-check"></i></span>
                            <span v-else>{{b}}</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- CONFIGURAÇÕES -->
            <div v-if="showSettings" class="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-6 backdrop-blur-md" @click.self="showSettings = false">
                <div class="bg-white w-full max-w-xs p-8 rounded-3xl shadow-2xl space-y-6">
                    <div>
                        <h3 class="font-bold text-lg mb-2">Meta do Mês</h3>
                        <input type="number" v-model="tempLimit" class="w-full p-4 bg-gray-100 rounded-2xl font-bold text-xl outline-none mb-3">
                        <button @click="saveLimit" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">Salvar Meta</button>
                    </div>
                    
                    <div class="pt-4 border-t border-gray-100">
                        <p class="text-[10px] text-gray-400 font-bold uppercase mb-3 tracking-widest text-center">Ferramentas de Manutenção</p>
                        <button @click="forceSync" :disabled="isSyncing" class="w-full py-4 px-4 bg-orange-50 text-orange-600 rounded-2xl font-bold text-xs uppercase flex items-center justify-center gap-2 active:scale-95 transition-all">
                            <i class="fas fa-sync-alt" :class="{'animate-spin': isSyncing}"></i>
                            {{ isSyncing ? 'Sincronizando...' : 'Recalcular Saldo do Mês' }}
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <script type="module">
        const { createApp, ref, computed, onMounted, watch } = Vue;
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, getDoc, getDocs, query, onSnapshot, enableIndexedDbPersistence } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = { apiKey: "AIzaSyBynG1L1voQ-GJnjwv7KeKV6p64eDxD8KY", authDomain: "gastosmensais-3d721.firebaseapp.com", projectId: "gastosmensais-3d721", storageBucket: "gastosmensais-3d721.firebasestorage.app", messagingSenderId: "564092336226", appId: "1:564092336226:web:8d68fb169fc09dce84793b" };
        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);
        const appId = 'gastosmensais-3d721'; 

        enableIndexedDbPersistence(db).catch(() => {});

        createApp({
            setup() {
                const appReady = ref(false);
                const user = ref(null);
                const monthlyLimitsMap = ref({}); 
                const defaultLimit = ref(2000);
                const isSyncing = ref(false);
                const currentDate = ref(new Date());
                const currentMonthSummary = ref({ totalDebit: 0, totalCredit: 0, items: [] });

                const loginEmail = ref('douglasrgomes@gmail.com');
                const loginPassword = ref('');
                const isLoggingIn = ref(false);
                const showModal = ref(false);
                const showSettings = ref(false);
                const tempLimit = ref(2000);
                const editingId = ref(null);

                const newTransaction = ref({ amount: 0, description: '', type: 'debit', date: new Date() });
                const showCalculator = ref(false);
                const calcDisplay = ref('0');

                const currentMonthKey = computed(() => `${currentDate.value.getFullYear()}-${(currentDate.value.getMonth() + 1).toString().padStart(2, '0')}`);
                const currentMonthDisplay = computed(() => new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(currentDate.value));
                const currentMonthlyLimit = computed(() => monthlyLimitsMap.value[currentMonthKey.value] ?? defaultLimit.value);
                
                const totalSpent = computed(() => currentMonthSummary.value.totalDebit + currentMonthSummary.value.totalCredit);
                const totalDebit = computed(() => currentMonthSummary.value.totalDebit);
                const totalCredit = computed(() => currentMonthSummary.value.totalCredit);
                const remainingBudget = computed(() => currentMonthlyLimit.value - totalSpent.value);
                const progressPercentage = computed(() => Math.min((totalSpent.value / (currentMonthlyLimit.value || 1)) * 100, 100));
                const progressBarColor = computed(() => progressPercentage.value > 95 ? 'bg-red-600' : 'bg-emerald-300');
                const formattedAmountDisplay = computed(() => newTransaction.value.amount === 0 ? '' : newTransaction.value.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2 }));
                const transactions = computed(() => currentMonthSummary.value.items || []);
                const sortedTransactions = computed(() => [...transactions.value].sort((a, b) => new Date(b.date) - new Date(a.date)));

                const syncMonth = async (u, monthKey) => {
                    if (isSyncing.value) return;
                    isSyncing.value = true;
                    try {
                        const targetMonth = currentDate.value.getMonth();
                        const targetYear = currentDate.value.getFullYear();
                        const q = query(collection(db, 'artifacts', appId, 'users', u.uid, 'expenses'));
                        const snap = await getDocs(q);
                        let deb = 0, cre = 0, items = [];
                        snap.docs.forEach(d => {
                            const data = d.data();
                            const dDate = data.date?.toDate ? data.date.toDate() : new Date(data.date);
                            if (dDate.getMonth() === targetMonth && dDate.getFullYear() === targetYear) {
                                const item = { id: d.id, ...data, date: dDate.toISOString() };
                                items.push(item);
                                if (data.type === 'credit') cre += (data.amount || 0);
                                else deb += (data.amount || 0);
                            }
                        });
                        await setDoc(doc(db, 'artifacts', appId, 'users', u.uid, 'summaries', monthKey), { totalDebit: deb, totalCredit: cre, items: items }, { merge: true });
                    } catch (e) { console.error(e); } finally { isSyncing.value = false; }
                };

                const saveTransaction = async () => {
                    if (newTransaction.value.amount <= 0 || !user.value) return;
                    
                    const transactionId = editingId.value || doc(collection(db, 'temp')).id;
                    const dateObj = newTransaction.value.date instanceof Date ? newTransaction.value.date : new Date(newTransaction.value.date);
                    const data = { 
                        id: transactionId, 
                        amount: parseFloat(newTransaction.value.amount), 
                        description: newTransaction.value.description || 'Gasto', 
                        type: newTransaction.value.type, 
                        date: dateObj.toISOString() 
                    };
                    
                    const summaryRef = doc(db, 'artifacts', appId, 'users', user.value.uid, 'summaries', currentMonthKey.value);

                    try {
                        const summarySnap = await getDoc(summaryRef);
                        let sData = summarySnap.exists() ? summarySnap.data() : { totalDebit: 0, totalCredit: 0, items: [] };
                        let items = sData.items || [];
                        let totalDeb = sData.totalDebit || 0;
                        let totalCre = sData.totalCredit || 0;

                        if (editingId.value) {
                            const oldItemIndex = items.findIndex(i => i.id === editingId.value);
                            if (oldItemIndex !== -1) {
                                const oldItem = items[oldItemIndex];
                                if (oldItem.type === 'credit') totalCre -= oldItem.amount;
                                else totalDeb -= oldItem.amount;
                                items.splice(oldItemIndex, 1);
                            }
                        }

                        if (data.type === 'credit') totalCre += data.amount;
                        else totalDeb += data.amount;
                        items.push(data);

                        await setDoc(summaryRef, { totalDebit: totalDeb, totalCredit: totalCre, items: items }, { merge: true });
                        await setDoc(doc(db, 'artifacts', appId, 'users', user.value.uid, 'expenses', transactionId), data);
                        
                        // Garante a limpeza total dos campos para o próximo lançamento
                        newTransaction.value = { amount: 0, description: '', type: 'debit', date: new Date() };
                        
                        closeModal();
                    } catch (e) { console.error(e); }
                };

                const handleDeleteRequest = () => {
                    if (editingId.value) deleteTransaction(editingId.value);
                };

                const deleteTransaction = async (id) => {
                    if (!confirm("Excluir permanentemente?") || !user.value) return;
                    
                    try {
                        const summaryRef = doc(db, 'artifacts', appId, 'users', user.value.uid, 'summaries', currentMonthKey.value);
                        const summarySnap = await getDoc(summaryRef);
                        
                        if (summarySnap.exists()) {
                            const sData = summarySnap.data();
                            let items = sData.items || [];
                            const itemIndex = items.findIndex(i => i.id === id);

                            if (itemIndex !== -1) {
                                const itemToDelete = items[itemIndex];
                                let totalDeb = sData.totalDebit || 0;
                                let totalCre = sData.totalCredit || 0;

                                if (itemToDelete.type === 'credit') totalCre -= itemToDelete.amount;
                                else totalDeb -= itemToDelete.amount;

                                items.splice(itemIndex, 1);

                                await setDoc(summaryRef, { 
                                    totalDebit: totalDeb, 
                                    totalCredit: totalCre, 
                                    items: items 
                                }, { merge: true });
                            }
                        }

                        await deleteDoc(doc(db, 'artifacts', appId, 'users', user.value.uid, 'expenses', id));
                        closeModal();
                    } catch (e) { console.error("Erro na exclusão:", e); }
                };

                watch([user, currentMonthKey], ([u, month]) => {
                    if (!u) return;
                    onSnapshot(doc(db, 'artifacts', appId, 'users', u.uid, 'summaries', month), (s) => {
                        if (s.exists()) currentMonthSummary.value = s.data();
                        else syncMonth(u, month);
                    });
                }, { immediate: true });

                onMounted(() => {
                    onAuthStateChanged(auth, (u) => {
                        user.value = u; appReady.value = true;
                        setTimeout(() => document.getElementById('splash-screen')?.classList.add('hidden'), 400);
                        if (u) {
                            onSnapshot(doc(db, 'artifacts', appId, 'users', u.uid, 'settings', 'config'), (s) => {
                                if (s.exists()) { monthlyLimitsMap.value = s.data().monthlyLimits || {}; defaultLimit.value = s.data().monthlyLimit || 2000; }
                            });
                        }
                    });
                });

                const handleAmountInput = (e) => { let val = e.target.value.replace(/\D/g, ''); newTransaction.value.amount = val ? parseFloat(val) / 100 : 0; };
                const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
                const formatDateShort = (dStr) => { const d = new Date(dStr); return new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit' }).format(d); };
                const changeMonth = (d) => { const newD = new Date(currentDate.value); newD.setMonth(newD.getMonth() + d); currentDate.value = newD; };
                const openModal = () => { editingId.value = null; newTransaction.value = { amount: 0, description: '', type: 'debit', date: new Date() }; showModal.value = true; };
                const editTransaction = (t) => { editingId.value = t.id; newTransaction.value = { ...t }; showModal.value = true; };
                const closeModal = () => { showModal.value = false; editingId.value = null; };
                const handleLogout = () => confirm('Sair?') && signOut(auth);
                const handleLogin = async () => { isLoggingIn.value = true; try { await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value); } catch (e) { console.error(e); } finally { isLoggingIn.value = false; } };
                const saveLimit = async () => { await setDoc(doc(db, 'artifacts', appId, 'users', user.value.uid, 'settings', 'config'), { monthlyLimits: { ...monthlyLimitsMap.value, [currentMonthKey.value]: parseFloat(tempLimit.value) } }, { merge: true }); showSettings.value = false; };
                const toggleSettings = () => { tempLimit.value = currentMonthlyLimit.value; showSettings.value = !showSettings.value; };
                const forceSync = () => user.value && syncMonth(user.value, currentMonthKey.value);

                const handleCalc = (b) => {
                    if (b === 'C') calcDisplay.value = '0';
                    else if (b === '←') calcDisplay.value = calcDisplay.value.slice(0, -1) || '0';
                    else if (b === '=') { try { calcDisplay.value = eval(calcDisplay.value.replace(/×/g, '*').replace(/÷/g, '/')).toString(); } catch { calcDisplay.value = 'Erro'; } }
                    else if (b === 'OK') { handleCalc('='); const res = parseFloat(calcDisplay.value); if (!isNaN(res)) newTransaction.value.amount = res; showCalculator.value = false; }
                    else calcDisplay.value = calcDisplay.value === '0' ? b : calcDisplay.value + b;
                };

                return { appReady, user, sortedTransactions, isSyncing, loginEmail, loginPassword, isLoggingIn, handleLogin, handleLogout, showModal, showSettings, newTransaction, tempLimit, currentMonthDisplay, changeMonth, currentMonthlyLimit, formatCurrency, formatDateShort, openModal, closeModal, saveTransaction, editTransaction, editingId, formattedAmountDisplay, handleAmountInput, remainingBudget, progressPercentage, progressBarColor, totalSpent, totalDebit, totalCredit, showCalculator, calcDisplay, handleCalc, transactions, saveLimit, toggleSettings, forceSync, handleDeleteRequest };
            }
        }).mount('#app');
    </script>
